<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML 原型 · 响应式预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#202124;color:#d8d8db;font-family:Arial,sans-serif}.preview-toolbar{height:60px;display:flex;align-items:center;justify-content:center;gap:12px;position:sticky;top:0;background:#303134;z-index:2;font-size:13px}.preview-toolbar strong{margin-right:20px}.preview-toolbar button,.preview-toolbar a{border:1px solid #666;border-radius:20px;padding:8px 17px;color:#ddd;background:#36373b;text-decoration:none;cursor:pointer;font-size:12px}.preview-toolbar button.active{border-color:#a7bf5c;color:#d7e899;background:#44512c}.preview-body{padding:30px;min-width:max-content}.frame-wrap{margin:auto;width:390px;background:#080808;border:1px solid #555;border-radius:22px;padding:10px;box-shadow:0 10px 40px #0007}.device-info{text-align:center;font-size:11px;color:#9d9d9d;margin-bottom:12px}iframe{width:390px;height:844px;border:0;display:block;background:#000;border-radius:12px}.frame-wrap{width:max-content}.preview-toolbar small{color:#aaa}@media(max-width:600px){.preview-toolbar{gap:7px;font-size:10px;height:94px;flex-wrap:wrap;padding:14px}.preview-toolbar strong{margin:0}.preview-toolbar button,.preview-toolbar a{padding:5px 10px}.preview-toolbar small{display:none}.preview-body{padding:20px 8px}}
  </style>
</head>
<body>
  <div class="preview-toolbar"><strong>HTML 原型 · 响应式预览</strong><button class="active" data-width="390" data-height="844">手机 390</button><button data-width="768" data-height="1024">平板 768</button><button data-width="1440" data-height="900">桌面 1440</button><select id="surface" aria-label="预览界面" style="padding:8px;background:#36373b;color:#ddd;border:1px solid #666;border-radius:16px"><option value="h5">H5 前台</option><option value="pc">PC 前台</option><option value="admin">运营后台</option></select><a href="index.html?view=admin#/dashboard">打开运营后台</a><a href="index.html?view=pc">打开前台</a><small>预览框拥有独立视口，使用相同页面与 CSS。</small></div>
  <main class="preview-body"><div class="device-info" id="device-info">390 × 844</div><div class="frame-wrap"><iframe id="preview" title="HTML 原型预览" src="index.html?view=h5&amp;frame=1"></iframe></div></main>
  <script>
    document.querySelector('#surface').addEventListener('change',e=>{const mode=e.target.value;document.querySelector('#preview').src='index.html?view='+mode+'&frame=1'+(mode==='admin'?'#/dashboard':'#/');});
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('#preview');frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.querySelector('#device-info').textContent=button.dataset.width+' × '+button.dataset.height;document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===button));}));
  </script>
</body>
</html>
